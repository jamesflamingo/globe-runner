<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="./styles/style.css">
</head>
<body>

  <div id="start-screen" class="container">
    <img
      id="start-screen-image"
      src="./images/50542cc8-caf4-4ffd-ada8-f555c68ae277.png"
      alt="Globe Runner start screen"
    >
    <button id="start-btn">¡LET'S ROCK!</button>
    <button id="options-btn">HOW TO<br>PLAY</button>
  </div>

  <div id="game-screen" class="container">
    <p class="game-score game-timer" aria-label="Time"><span id="timer">0.0</span></p>
    <p class="game-score game-points" aria-label="Score"><span id="score">0</span></p>
    <div id="game-viewport">
      <div id="game-box">
        <div id="game-area"></div>
      </div>
    </div>
  </div>

  <div id="game-over-screen" class="container">
    <div class="game-over-artwork">
      <img
        id="game-over-image"
        src="./images/76632359-071a-4290-8ae2-e48b4ac8aad2.png"
        alt="Game over: captured by the corporation"
      >
      <span class="game-over-time-label">TIME</span>
      <p class="game-score game-over-timer"><span id="final-time">0.0</span></p>
      <span class="game-over-score-label">SCORE</span>
      <p class="game-score game-over-points"><span id="final-score">0</span></p>
      <button id="restart-btn"><span class="restart-line">RESTART</span><span class="restart-line restart-game-line">GAME</span></button>
    </div>
  </div>

  <script src="./js/main.js"></script>
  <script src="./js/player.js"></script>
  <script src="./js/globe.js"></script>

</body>
</html>
