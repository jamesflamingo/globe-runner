<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="./styles/style.css">
</head>
<body>

  <div id="start-screen" class="container">
    <img
      id="start-screen-image"
      src="./images/37be609b-2f96-43fc-a37a-c8de75a6f65b.png"
      alt="Globe Runner in a neon green city"
    >
    <button id="start-btn">¡LET'S ROCK!</button>
    <button id="options-btn">Options</button>
  </div>

  <div id="game-screen" class="container">
    <p class="game-score"><span id="score">0.0</span></p>
    <div id="game-viewport">
      <div id="game-box"></div>
    </div>
  </div>

  <div id="game-over-screen" class="container">
    <h2>Game Over</h2>
    <p>The corp caught you.</p>
    <p class="game-score"><span id="final-score">0.0</span></p>
    <button id="restart-btn">restart Game</button>
  </div>

  <script src="./js/main.js"></script>
  <script src="./js/player.js"></script>
  <script src="./js/globe.js"></script>

</body>
</html>
